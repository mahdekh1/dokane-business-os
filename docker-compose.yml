services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dokane
      POSTGRES_PASSWORD: dokane
      POSTGRES_DB: dokane
    ports:
      - "5432:5432"
    volumes:
      - dokane_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokane"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  dokane_pg:
