name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dokane
          POSTGRES_PASSWORD: dokane
          POSTGRES_DB: dokane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dokane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://dokane:dokane@localhost:5432/dokane
      DATABASE_URL_TEST: postgresql://dokane:dokane@localhost:5432/dokane
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @dokane/api exec prisma migrate deploy
      - run: pnpm test
      - run: pnpm build
